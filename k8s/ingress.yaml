apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-agent
  namespace: iam
  annotations:
    oci-native-ingress.oraclecloud.com/backend-tls-enabled: "false"
    oci-native-ingress.oraclecloud.com/healthcheck-path: "/health"
    oci-native-ingress.oraclecloud.com/healthcheck-protocol: "HTTP"
    oci-native-ingress.oraclecloud.com/https-listener-port: "443"
    oci-native-ingress.oraclecloud.com/session-persistence: '{"type":"lb-cookie","cookieName":"IAM_AGENT_SESSION","isSecure":true}'
spec:
  ingressClassName: ic
  tls:
    - hosts:
        - iam.devday26.sogawa-yk.com
      secretName: wildcard-sogawa-yk-com-tls
  rules:
    - host: iam.devday26.sogawa-yk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iam-agent
                port:
                  number: 80
